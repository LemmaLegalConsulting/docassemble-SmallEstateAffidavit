    datatype: yesnoradio
---
template: family_bens_help
subject: |
  **About which family members are closest**
content: |
  The decedent's closest family members will be their beneficiaries. If the decedent had a spouse or children, they will be the beneficiaries. If one of their children had children of their own and then died, those grandchildren will also be beneficiaries.

  If the decedent did not have a spouse or children, their parents and siblings will be beneficiaries. If one of their siblings had children and then died, those children will also be beneficiaries.

  If the decedent has no siblings and their parents are dead, their grandparents or their grandparents' descendants will be their beneficiaries.
---
id: user is fiduciary 
question: |
  Are you a representative or fiduciary of one of the decedent's beneficiaries?
subquestion: |
     A representative is a person who is legally appointed to act for someone else. They could be a legal guardian or someone with power of attorney.

     A fiduciary is a person who manages someone else's money or property. They could be a money manager, an accountant, or a trustee.

fields:
  - no label: user_is_fid
    datatype: yesnoradio
