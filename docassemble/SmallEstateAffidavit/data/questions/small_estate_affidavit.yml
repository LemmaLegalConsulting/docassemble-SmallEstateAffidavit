template: class_list
subject: |
  **The order claims against the estate should be paid**
content: |
  Estates should pay their debts in the following order:  

  * Class 1: Funeral and burial expenses
  * Class 2: Surviving spouse and dependent children's awards
  * Class 3: Debts due to the United States
  * Class 4: Money due employees
  * Class 5: Money or property held in trust
  * Class 6: Debts due to the State of Illinois or others
  * Class 7: All other claims
