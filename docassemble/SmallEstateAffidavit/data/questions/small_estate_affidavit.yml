      user_who_choices.append(person.name_full())
  if have_a_will:
    if heirs.there_are_any:
      for person in heirs:
        user_who_choices.append(person.name_full())
    if residue_mentioned:
      if residue_heirs.there_are_any:
        for person in residue_heirs:
          user_who_choices.append(person.name_full())
    elif intestate_heirs.there_are_any:
      for person in intestate_heirs:
        user_who_choices.append(person.name_full())
  if not have_a_will and intestate_heirs.there_are_any:
    for person in intestate_heirs:
      user_who_choices.append(person.name_full())
  if have_a_will:
    user_who_choices.append("I am someone else.")
