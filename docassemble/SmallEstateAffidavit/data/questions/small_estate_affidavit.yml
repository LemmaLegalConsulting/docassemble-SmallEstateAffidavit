id: welcome
question: |
  Small estate affidavit
subquestion: |
  Welcome to Illinois Legal Aid Online's **Small estate affidavit** Easy Form.

  This program will help you make a small estate affidavit. You can use it if you want to transfer someone's personal property without going to court.

  To learn more, read ILAO's guide on [**Transferring property with a small estate affidavit basics**](https://www.illinoislegalaid.org/node/31841).
field: sees_nav_bar
---
id: instructions
continue button field: how_to_use
question: |
  Instructions
subquestion: |
  To fill out the forms, you will need to know:

  * Name, address, and the date of death of the **{decedent}**,
  * Name and address of the decedent's spouse, if any,
  * Names, addresses, and birthdates of the decedent's children, if any,
  * Information about the decedent's assets, such as bank accounts, cash, and stocks, and
  * Information about the decedent's debts.
  
  Set aside 15 to 30 minutes to finish this program. You can log in and save your work to continue later.
  
  ${ collapse_template(help_example) }
  
  Click on **{green words}** to learn what they mean. Some questions have a question mark in a circle ${ fa_icon("question-circle", color_css="#0dcaf0" ) } that also gives help.
terms:
  - decedent: |
      The **decedent** is the person who died.
---
template: help_example
subject: |
  **You can click sections like this to show more information.**
content: |
  This is an example of help. Click again to hide.
---
id: about small estate
continue button field: about_small_estate
question: |
  Using a small estate affidavit
subquestion: |
  To use this program, all of the following must be true:

    * The total amount of the decedent's property is no more than $150,000, not including motor vehicles,
    * The decedent either did not own real estate or their real estate went to someone else when they died, 
    * There are no court claims against the estate, and
    * A probate court has not issued any "letters of office" for this estate giving the executor authority to distribute the estate and no application for letters of office is pending,

  If there is a will:

   * It must have been filed with the clerk of the probate court,
   * It must be, to the best of your knowledge, a valid will and the decedent's last will, 
   * You must be the executor of the will, and
   * There are no disputes or conflicts relating to the will or to the heirs of the decedent.
---
id: about relationships
continue button field: about_relationships
question: |
  About who can use this program
subquestion: |
  To use this program, you must have a connection to the decedent's estate.

  If the decedent had a will, you can only use this program if you are the will's executor. An executor is the person in charge of giving out the property left in the will. Wills usually name the executor. If the will does not name an executor, a probate court will pick someone to handle the estate. To learn more, read ILAO's [**Probate FAQ**](https://www.illinoislegalaid.org/node/189971).

  If there is not a will, you must either be a beneficiary of the decedent, a **{representative}** of a beneficiary, or a **{fiduciary}** of the beneficiary. A beneficiary is someone who will inherit from the decedent. When there is no will, beneficiaries are usually the decedent's spouse, children, or other closest relatives. If any of the beneficiaries died after the decedent died, you can not use this program and may need a lawyer to help you with the estate. Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area. 
terms:
  - representative: |
      A **representative** is a person who is legally appointed to act for someone else.
  - fiduciary: |
     A **fiduciary** is a person who manages someone else's money or property.
---
id: why affidavit
continue button field: why_affidavit
question: |
  Reasons for making a small estate affidavit
subquestion: |
  When someone dies, their property needs to be given to their heirs. However, their property is usually not all in one place: it is in bank accounts, their home, safety deposit boxes, or other places. Getting the decedent's property to their heirs can be complicated, and sometimes people have to go to probate court to sort out the estate. 

  A small estate affidavit is a legal document that lets you manage an estate without going to probate court. It will list the property in the estate and say how it should be distributed. An executor or a beneficiary can use a small estate affidavit to tell banks, corporations, or anyone else with the decedent's property who should get the property.
---
id: how affidavits work
continue button field: how_work
question: |
  How small estate affidavits work
subquestion: |
  A small estate affidavit allows you to settle an estate without going to probate court. This means that it has to list all the money and assets in the estate, all the debts the estate owes, and everyone who will inherit part of the estate. If there is a will, the affidavit has to follow the will.

  First, the estate will need to pay any funeral or burial costs. Then, the estate will need to pay awards to the decedent's spouse and dependent children, if there are any. After that, the estate will need to pay its other debts.

  Once all the debts are paid, the rest of the estate will go to its heirs. If there is a will, the heirs will be named in the will. If there is not a will, the estate will go to the decedent's closest family.
---
id: whats next
continue button field: whats_next
question: |
  After you finish this program
subquestion: |
  Once you download your small estate affidavit, you will need to attach the decedent's death certificate and sign the document in front of a notary. To learn more about notaries, read ILAO's article, [**What is a notary?**](https://www.illinoislegalaid.org/node/176196)

  After the affidavit is signed and notarized, you can show it to a person, bank, or corporation who has the decedent's property. They will have to give away the property the way the affidavit says. If they do not, you may be able to file a court claim against them to get the property. To learn more, read ILAO's guide to [**using a small estate affidavit**](https://www.illinoislegalaid.org/node/31836).

  For cars and some other vehicles, you may need to use the [**Illinois Secretary of State's small estate affidavit form**](https://www.ilsos.gov/content/dam/publications/pdf_publications/rtopr31.pdf).
---
id: warning page
continue button field: warning_page
question: |
  Warning about small estate affidavits
subquestion: |
  If you use a small estate affidavit incorrectly, you may be personally liable for any losses you cause. This means you could be sued if you forget to include an heir, if you don't list all the estate's property in the affidavit, or if you don't pay one of the estate's debts.
  
  You should only use a small estate affidavit if you have the legal right to do so, and you should make sure that all information in the small estate affidavit is correct.
---
id: any real estate
question: |
  Does the decedent's estate have any real property?
subquestion: |
  "Real property" means land or buildings, like a house or an apartment.

  If the decedent did not own real property, click **No**.

  Real property can go to someone else without going to court if it was owned in a joint tenancy, held in a living trust, or transferred with a Transfer on Death Instrument. If the decedent's real property has already gone to someone else, click **No**.
fields:
  - no label: any_real_estate
    datatype: yesnoradio
---
id: large estate
question: |
  Is the decedent's estate more than $150,000, not including motor vehicles?
subquestion: |
  Motor vehicles are vehicles you need a driver's license to use. They need to be registered with the Illinois Secretary of State. 

  Cars, motorcycles, and trucks are all motor vehicles. You do not need to consider their value for this question.

  Bicycles, wheelchairs, and low-speed e-bikes are not motor vehicles. You should consider their value for this question.

  **Note:** Mobile homes, van campers, commercial vehicles, and buses **are included** in the estate that cannot be more than $150,000. You should consider their value for this question.
fields:
  - no label: large_estate
    datatype: yesnoradio
---
id: real estate kickout
event: real_estate_kickout
question: |
  Sorry
subquestion: |
  You cannot use this program for an estate that includes real property.

  If the decedent made a Transfer on Death Instrument, their real property may be transferred without going to court. To learn more, read ILAO's [**Transfer on Death Instrument FAQ**](https://www.illinoislegalaid.org/node/185961).

  If the decedent shared the real property with someone else, they may have been joint tenants. If they had a joint tenancy, the other joint tenants automatically inherited the decedent's share of the property and you can still use this program. To learn more, read ILAO's [**sharing property ownership FAQ**](https://www.illinoislegalaid.org/node/187846).

  Click **Back** if you made a mistake, or you can talk with a lawyer to discuss your options. Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.
buttons:
  - Exit: exit
  - Restart: restart
