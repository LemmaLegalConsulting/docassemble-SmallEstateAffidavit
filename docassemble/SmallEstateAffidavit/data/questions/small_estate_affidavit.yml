code: |
  collected_heirs.clear()
  spouse_and_dependents.clear()
  award_recipients.clear()
  if decedent.was_married:
    collected_heirs.append(spouse)
    spouse_and_dependents.append(spouse)
    award_recipients.append(spouse)
  if dependents.there_are_any:
    for dependent in dependents:
      collected_heirs.append(dependent)
      spouse_and_dependents.append(dependent)
      if not child_with_spouse(dependent):
        award_recipients.append(dependent)
  if have_a_will:
    if heirs.there_are_any:
      for heir in heirs:
        collected_heirs.append(heir)
    if residue_mentioned:
      if residue_heirs.there_are_any:
        for heir in residue_heirs:
          collected_heirs.append(heir)
    else:
      if (not decedent.was_married and not dependents.there_are_any) or intestate_heirs.there_are_any:
        for heir in intestate_heirs:
          collected_heirs.append(heir)
  else:
    if intestate_heirs.there_are_any:
      for heir in intestate_heirs:
        collected_heirs.append(heir)
  make_collected_heirs = True
