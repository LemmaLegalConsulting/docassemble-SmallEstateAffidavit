id: dependent review screen
continue button field: x.review_dependents
generic object: ALIndividual
question: |
  Edit ${x.name_full()}'s information
review:
  - Edit: x.name.first
    button: |
      **Name:**
      ${x.name_full()}
  - Edit: x.birthdate
    button: |
      **Birth date:**
      ${x.birthdate}
  - Edit: x.lives_with_decedent
    button: |
      **Did ${x.name_full()} live with ${decedent.name_full()}?**
      ${word(yesno(x.lives_with_decedent))}
  - Edit: x.lives_with_spouse
    button: |
      **Does ${x.name_full()} live with ${spouse.name_full()}?**
      ${word(yesno(x.lives_with_spouse))}
    show if: not x.lives_with_decedent and decedent.was_married and not spouse.lives_with_decedent
  - Edit: x.address.address
    button: |
      **${x.name_full()}'s address:**
      ${x.address.on_one_line(bare=True)}
    show if: not x.lives_with_decedent and (not decedent.was_married or spouse.lives_with_decedent or not x.lives_with_spouse)     
  - Edit: x.amount_received
    button: |
      **How much does ${x.name_full()} inherit under the will?**
      ${currency(x.amount_received)}
    show if: have_a_will
  - Edit: x.residue_check
    button: |
      **Will ${x.name_full()} inherit some of the residue?**
      ${word(yesno(x.residue_check))}
    show if: have_a_will and residue_mentioned
  - Edit: x.residue_numerator
    button: |
      **What fraction of the residue will go to ${x.name_full()}?**
      ${x.residue_numerator}/${x.residue_denominator}
    show if: have_a_will and (not residue_mentioned or x.residue_check)
  - Edit: x.numerator
    button: |
      **What fraction of the estate will go to ${x.name_full()}?**
      ${x.numerator}/${x.denominator}
    show if: not have_a_will
  - Edit: x.award
    button: |
      **How much should ${x.name_full()} be awarded?**
      ${currency(x.award)}
---
