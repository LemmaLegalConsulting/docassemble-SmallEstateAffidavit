template: intestacy_help
subject: |
  **About intestacy**
content: |
  % if decedent.was_married and (dependents.there_are_any or intestate_heirs.there_are_any):
   ${decedent.name_full()}'s spouse should get 1/2 of their estate. ${decedent.name_full()}'s children should each get an equal share of the rest of the estate. For example, if ${decedent.name_full()} has two children, they should each get 1/4 of the estate. If any of ${decedent.name_full()}'s children died after having their own children, those grandchildren will split their parent's share. For example, if ${decedent.name_full()} has one living child and a dead child who had two children, the living child should get 1/4 of the estate and the dead child's children should each get 1/8th of the estate.

  % elif dependents.there_are_any:
  ${decedent.name_full()}'s children should each get an equal share of the estate. For example, if ${decedent.name_full()} has three children, they should each get 1/3 of the estate. If any of ${decedent.name_full()}'s children died after having their own children, those grandchildren will split their parent's share. For example, if ${decedent.name_full()} has two living children and a dead child who had two children, the living children should each get 1/3 of the estate and the dead child's children should each get 1/6th of the estate.
  % else:
  If ${decedent.name_full()} has any children, they should each get an equal share of the estate. For example, if ${decedent.name_full()} has three children, they should each get 1/3 of the estate. If any of ${decedent.name_full()}'s children died after having their own children, those grandchildren will split their parent's share. For example, if ${decedent.name_full()} has two living children and a dead child who had two children, the living children should each get 1/3 of the estate and the dead child's children should each get 1/6th of the estate.

  If ${decedent.name_full()} has no children, their parents, siblings, and half-siblings will get equal shares of the estate. If one of ${decedent.name_full()}'s parents have died, the other parent will get a double share. For example, if ${decedent.name_full()} has one living parent and one sibling, their parent should inherit 2/3 of the estate and their sibling should inherit 1/3. If any of the siblings died after having children, those children will get their parent's share. For example, if ${decedent.name_full()} has one living parent, one living sibling, and a dead sibling who had two children, their parent should get 1/2 of the estate, the living sibling should get 1/4 of the estate, and the dead sibling's children should each get 1/8th of the estate.

  If ${decedent.name_full()} does not have siblings or any living parents, their grandparents will inherit their estate.  For example, if ${decedent.name_full()}'s maternal grandmother and both their paternal grandparents are alive, their maternal grandmother should get 1/2 of the estate and their paternal grandparents should each get 1/4 of the estate. If ${decedent.name_full()}'s grandparents have died, their descendants will inherit their share. For example, if ${decedent.name_full()}'s maternal grandmother is alive and their paternal grandparents died with two living children, their maternal grandmother should get 1/2 of the estate and their paternal grandparent's children should each get 1/4 of the estate.
  % endif
