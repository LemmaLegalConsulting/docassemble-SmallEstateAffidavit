id: user is beneficiary
question: |
  Are you a beneficiary of the decedent's estate?
subquestion: |
  A beneficiary is someone who gets property or money from someone when they die.

  Since there is not a will, the decedent's closest family members will be their beneficiaries.

  ${collapse_template(family_bens_help)}

  If you are among the decedent's closest family members, click **Yes**.
