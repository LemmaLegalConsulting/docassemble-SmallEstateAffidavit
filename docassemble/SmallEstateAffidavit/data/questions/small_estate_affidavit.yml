#interview order block
mandatory: True
code: |
  nav.set_section('section_intro')
  sees_nav_bar
  snapshot_start
  how_to_use
  set_progress(5)
  accept_terms
  why_affidavit
  about_small_estate
  about_relationships
  
  how_work
  warning_page
  whats_next
  if any_real_estate:
    real_estate_kickout
  if large_estate:
    early_large_estate_kickout
  
  nav.set_section('section_estate')
  set_progress(20)
  if have_a_will:
    if not will_filed or not prompt_file:
      not_filed_kickout
    elif not user_is_executor:
      not_executor_kickout
  elif not user_is_ben:
    if not user_is_fid:
      not_ben_kickout
  decedent.name.first
  death_date
  decedent.address.address
  
  nav.set_section('section_heirs')
  if decedent.was_married:
    spouse.name.first
    spouse.relationship = "Spouse"
    spouse.flag = "spouse"
    if not spouse.still_alive:
      spouse_passed_kickout
    get_spouse_address(spouse, decedent)
  if dependents.there_are_any:
    if have_dependents_passed:
      dependents_passed_kickout
    dependents.gather()
  set_progress(40)
  if have_a_will:
    if (decedent.was_married or dependents.there_are_any) and not spouse_decedent_in_will:
      not_in_will_kickout
    if decedent.was_married:
      spouse.amount_received
    if dependents.there_are_any:
      for dependent in dependents:
        dependent.amount_received
    any_heirs_code
    if heirs.there_are_any:
      heirs.gather()
    if residue_mentioned:
      if decedent.was_married:
        if spouse.residue_check:
          spouse.residue_numerator
      if dependents.there_are_any:
        for person in dependents:
          if person.residue_check:
            person.residue_numerator
      for person in heirs:
        if person.flag != "intestate" and person.flag != "residue":
          if person.residue_check:
            person.residue_numerator
      if residue_heirs.there_are_any:
        residue_heirs.gather()
    else:
      residue_intestate
      if not decedent.was_married and not dependents.there_are_any:
        intestate_residue_flag
      if intestate_heirs.there_are_any:
        intestate_heirs.gather()
      if decedent.was_married:
        spouse_residue_intestate_code
      if dependents.there_are_any:
        for person in dependents:
          person.residue_numerator
      for person in intestate_heirs:
        person.residue_numerator
  else:
    about_intestacy
    if not decedent.was_married and not dependents.there_are_any:
      who_is_intestate
      any_other_children
      intestate_heirs.gather()
    elif intestate_heirs.there_are_any:
      intestate_heirs.gather()
    if decedent.was_married:
      spouse_intestate_code
    if dependents.there_are_any:
      for dependent in dependents:
        dependent.numerator
    
    if decedent.was_married and not dependents.there_are_any and not intestate_heirs.there_are_any:
      spouse_gets_all
    else:
      if decedent.was_married:
        spouse_gets_half
      if dependents.there_are_any:
        for dependent in dependents:
          dependent.numerator
      if intestate_heirs.there_are_any:
        for heir in intestate_heirs:
          heir.denominator 
  
    if (not decedent.was_married and not dependents.there_are_any) or intestate_heirs.there_are_any: 
      for person in intestate_heirs:
        person.numerator
  set_progress(60)
  
  nav.set_section('section_assets')
  assets.gather()
  get_total
  if carless_total > 150000:
    late_large_estate_kickout
  unclaimed_property

  nav.set_section('section_debts')
  if funeral_debts.there_are_any:
    funeral_debts.gather()
  if decedent.was_married or dependents.there_are_any:
    about_awards
    if decedent.was_married:
      spouse.award
    if dependents.there_are_any:
      for dependent in dependents:
        if not child_with_spouse(dependent):
          dependent.award
  set_progress(80)
  if trust_property.there_are_any:
    trust_property.gather()
  if us_debts.there_are_any:
    us_debts.gather()
  if employee_debts.there_are_any:
    employee_debts.gather()
  if illinois_debts.there_are_any:
    illinois_debts.gather()
  if other_debts.there_are_any:
    other_debts.gather()
  about_paying_debts

  nav.set_section('section_user')
  if have_a_will or user_is_ben:
    users[0].who
    if have_a_will and users[0].who == "I am someone else.":
      users[0].name.first
      users[0].relationship
  else:
    users[0].rep_who
    users[0].name.first
  if agent_needed(users[0]):
    agent.name.first
    agent.address.address
    agent.phone_number
  if have_a_will:
    will_text_info
  next_steps

  nav.set_section('section_download')
  set_progress(100)
  forms_assembling
  make_collected_heirs
  snapshot_forms
  get_docs_screen
