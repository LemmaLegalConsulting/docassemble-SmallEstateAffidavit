  % else:
   Under intestacy, if ${decedent.name_full()} had any living children, their children will be the heirs. If ${decedent.name_full()} has any children who died after having children of their own, those grandchildren will also be heirs.

  If ${decedent.name_full()} has no living children or other descendants, their parents, siblings, and half-siblings will be their heirs. If any of their siblings died after having children, those nieces or nephews will also be heirs.

  If ${decedent.name_full()} has no living siblings, parents, nieces, or nephews, their grandparents will be their intestate heirs. If any of their grandparents have died, those grandparents' descendants will also be heirs.
  % endif

  Intestacy can be complicated. You may want to talk with a lawyer. Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area. 
