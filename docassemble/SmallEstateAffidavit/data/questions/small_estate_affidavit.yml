id: estate review screen
section: About the estate
event: section_estate
question: |
  About the estate
subquestion: |
  Edit your answers below.
review:
  - Edit: have_a_will
    button: |
      **Did the person who died leave a will?**

      ${ word(yesno(have_a_will)) if defined('have_a_will') else '' }
  - Edit: will_filed
    button: |
      **Has the will been filed with the court clerk?**

      ${ word(yesno(will_filed)) if defined('will_filed') else '' }
    show if: have_a_will
  - Edit: user_is_executor
    button: |
      **Are you the executor of the will?**

      ${ word(yesno(user_is_executor)) if defined('user_is_executor') else '' }
    show if: have_a_will
  - Edit: user_is_ben
    button: |
      **Are you a beneficiary of the decedent's estate?**

      ${ word(yesno(user_is_ben)) if defined('user_is_ben') else '' }
    show if: not have_a_will
  - Edit: user_is_fid
    button: |
      **Are you a representative or fiduciary of one of the decedent's beneficiaries?**

      ${ word(yesno(user_is_fid)) if defined('user_is_fid') else '' }
    show if: not have_a_will and not user_is_ben
  - Edit: decedent.name.first
    button: |
      **What is the name of the person who died?**

      ${ decedent if defined('decedent.name.first') else '' }
  - Edit: death_date
    button: |
      **When did ${decedent.name_full()} die?**

      ${ showifdef('death_date') }
  - Edit: decedent.address.address
    button: |
      **Where was ${decedent.name_full()} living when they died?**

      ${decedent.address.on_one_line(bare=True)}
---
id: heirs review screen
section: Heirs
event: section_heirs
question: |
  Heirs
subquestion: |
  Edit your answers below.
review:
  - Edit: decedent.was_married
    button: |
      **Was ${decedent.name_full()} married when they died?**

      ${ word(yesno(decedent.was_married)) if defined('decedent.was_married') else '' }
  - Edit: spouse.name.first
    button: |
      **What is the name of ${decedent.name_full()}'s spouse?**

      ${ spouse if defined('spouse.name.first') else '' }
    show if: decedent.was_married
  - Edit: spouse.still_alive
    button: |
      **Is ${spouse.name_full()} alive?**

      ${ word(yesno(spouse.still_alive)) if defined('spouse.still_alive') else '' }
    show if: decedent.was_married
  - Edit: 
      - spouse.lives_with_decedent
      - recompute:
          - spouse.address.address
    button: |
      **Did ${spouse.name_full()} live with ${decedent.name_full()}?**
      ${word(yesno(spouse.lives_with_decedent))}
    show if: decedent.was_married
  - Edit: spouse.address.address
    button: |
      **${spouse.name_full()}'s address:**
      ${spouse.address.on_one_line(bare=True)}
    show if: decedent.was_married
  - Edit: dependents.there_are_any
    button: |
      **Did ${decedent.name_full()} have any dependents?**
      ${word(yesno(dependents.there_are_any))}
  - Edit: have_dependents_passed
    button: |
      **Have any of ${decedent.name_full()}'s dependent children died since ${decedent.name_full()}'s death?**

      ${ word(yesno(have_dependents_passed)) if defined('have_dependents_passed') else '' }
    show if: dependents.there_are_any
  - Edit: dependents.revisit
    button: |-
      **Minor children and adult dependent children:**

      % for item in dependents:
      - ${ item }
      % endfor
    show if: dependents.there_are_any
  - Edit: spouse_decedent_in_will
    button: |
      <strong>
      % if decedent.was_married and dependents.there_are_any:
      Are ${comma_and_list(spouse, dependents)} named in the will?
      % elif decedent.was_married:
      Is ${spouse.name_full()} named in the will?
      % elif dependents.number_gathered() == 1:
      Is ${dependents[0].name_full()} named in the will?
      % else:
      Are ${dependents.full_names()} named in the will?
      % endif
      </strong>

      ${ word(yesno(spouse_decedent_in_will)) if defined('spouse_decedent_in_will') else '' }
    show if: have_a_will and (decedent.was_married or dependents.there_are_any)
  - Edit: heirs.there_are_any
    button: |
      **Did ${decedent.name_full()} name anyone else in their will?**
      ${word(yesno(heirs.there_are_any))}
    show if: have_a_will and (decedent.was_married or dependents.there_are_any)   
  - Edit: heirs.revisit
    button: |
      % if dependents.there_are_any or decedent.was_married:
      **Other heirs:**
      % else:
      **Heirs:**
      % endif

      % for item in heirs:
      - ${ item }
      % endfor
    show if: have_a_will and ((not decedent.was_married and not dependents.there_are_any) or heirs.there_are_any)
  - Edit: residue_mentioned
    button: |
      **Does the will say who will get the estate's residue?**
      ${word(yesno(residue_mentioned))}
    show if: have_a_will
  - Edit: residue_heirs.there_are_any
    button: |
      **Are there any other heirs who will get residue?**

      ${ word(yesno(residue_heirs.there_are_any)) if defined('residue_heirs.there_are_any') else '' }
    show if: have_a_will and residue_mentioned and (decedent.was_married or dependents.there_are_any)
  - Edit: residue_heirs.revisit
    button: |
      **Residue heirs:**

      % for item in residue_heirs:
      - ${ item }
      % endfor
    show if: have_a_will and residue_mentioned and ((not decedent.was_married and not dependents.there_are_any) or residue_heirs.there_are_any)
  - Edit: intestate_heirs.there_are_any
    button: |
      <strong>
      % if dependents.there_are_any:
      Did ${decedent.name_full()} have any other children?
      % else: 
      Did ${decedent.name_full()} have any children?
      % endif
      </strong>

      ${ word(yesno(intestate_heirs.there_are_any)) if defined('intestate_heirs.there_are_any') else '' }
    show if: not have_a_will and (decedent.was_married or dependents.there_are_any)
  - Edit: intestate_heirs.revisit
    button: |
      % if not decedent.was_married and not dependents.there_are_any:
      **Heirs:**
      % else:
      **Other heirs:**
      % endif

      % for item in intestate_heirs:
      - ${ item }
      % endfor
    show if: not have_a_will and ((not decedent.was_married and not dependents.there_are_any) or intestate_heirs.there_are_any)
  - Edit: intestate_heirs.revisit
    button: |
      **Intestate heirs:**

      % for item in intestate_heirs:
      - ${ item }
      % endfor
    show if: have_a_will and not residue_mentioned
