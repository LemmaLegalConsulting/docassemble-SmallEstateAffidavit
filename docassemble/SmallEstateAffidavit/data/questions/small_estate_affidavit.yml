template: award_explainer
subject: |
  **What is the difference between an award and an inheritance?**
content: |
  % if decedent.was_married and dependents.there_are_any:
  An **award** is treated like a debt of the estate. The estate pays an **award** before it pays most other debts. This means that   ${decedent.name_full()}'s spouse and dependent children will get a part of the estate even if there is not enough money to pay all the estate's debt.
  % elif decedent.was_married:
  An **award** is treated like a debt of the estate. The estate pays an **award** before it pays most other debts. This means that   ${decedent.name_full()}'s spouse will get a part of the estate even if there is not enough money to pay all the estate's debt.
  % elif dependents.there_are_any:
  An **award** is treated like a debt of the estate. The estate pays an **award** before it pays most other debts. This means that   ${decedent.name_full()}'s dependent children will get a part of the estate even if there is not enough money to pay all the estate's debt.
  % endif

  An **inheritance** is a share of what is left in the estate after its debts are paid.
---
