id: about paying debts
continue button field: about_paying_debts
question: |
  About paying the estate's debts
subquestion: |
  You will need to pay the estate's debts before you give the heirs their shares of the estate.

  The estate's debts will need to be paid in order. This order is based on class of debt each one falls under. The debts you entered will be listed in order on the small estate affidavit.

  ${collapse_template(class_list)}

  If ${decedent.name_full()}'s estate does not have enough cash to pay its debts, you will have to sell off the estate's other assets to pay the debts. If that still is not enough, some of the estate's creditors may be unpaid and the heirs will get nothing. You may want to talk with a lawyer. Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area. 
