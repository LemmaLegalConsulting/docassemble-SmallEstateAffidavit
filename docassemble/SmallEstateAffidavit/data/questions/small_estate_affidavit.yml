code: |
  def share_value(person):
    if have_a_will:
      if residue_mentioned:
        if person.flag == "residue":
          return str(person.residue_numerator) + "/" + str(person.residue_denominator) + " of the residue"
        elif person.residue_check:
          return currency(person.amount_received) + ", and " + str(person.residue_numerator) + "/" + str(person.residue_denominator) + " of the residue"
        else: 
          return currency(person.amount_received)
      elif person.flag == "spouse" or person.flag == "dependent":
        return currency(person.amount_received) + ", and " + str(person.residue_numerator) + "/" + str(person.residue_denominator) + " of the residue"
      elif person.flag == "intestate":
        return str(person.residue_numerator) + "/" + str(person.residue_denominator) + " of the residue"
      else:
        return currency(person.amount_received)
    else:
      return str(person.numerator) + "/" + str(person.denominator) + " of the estate"
