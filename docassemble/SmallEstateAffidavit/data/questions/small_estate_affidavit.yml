question: |
  About you
subquestion: |
  Edit your answers below.
review:
  - Edit: user_is_executor
    button: |
      **Are you the executor of the will?**

      ${ word(yesno(user_is_executor)) if defined('user_is_executor') else '' }
    show if: have_a_will
  - Edit: user_is_ben
    button: |
      **Are you a beneficiary of the decedent's estate?**

      ${ word(yesno(user_is_ben)) if defined('user_is_ben') else '' }
    show if: not have_a_will
  - Edit: user_is_fid
    button: |
      **Are you a representative or fiduciary of one of the decedent's beneficiaries?**

      ${ word(yesno(user_is_fid)) if defined('user_is_fid') else '' }
    show if: not have_a_will and not user_is_ben
  - Edit: users[0].who
    button: |
      **Who are you?**
      %  if have_a_will and users[0].who == "I am someone else.":
      ${users[0].name_full()}
      % else:
      ${ showifdef('users[0].who') }
      % endif
    show if: have_a_will or user_is_ben
  - Edit: users[0].rep_who
    button: |
      **Who do you represent?**

      ${ showifdef('users[0].rep_who') }
    show if: not have_a_will and not user_is_ben and user_is_fid
  - Edit: users[0].name.first
    button: |
      **Your name:**
      ${ users[0] if defined('users[0].name.first') else '' }
    show if:  (have_a_will and users[0].who == "I am someone else.") or (not user_is_ben and user_is_fid)
  - Edit: users[0].address.address
    button: |
      **Your address:**
      ${users[0].address.on_one_line(bare=True)}
  - Edit: name_an_agent
    button: |
      **Do you want to name an agent for service of process?**
      ${ word(yesno(name_an_agent)) if defined('name_an_agent') else '' }
    show if: users[0].address.state == "IL"
  - Edit: agent.name.first
    button: |
      **What is the name of the agent for service of process?**

      ${ agent if defined('agent.name.first') else '' }
    show if: users[0].address.state != "IL" or name_an_agent
  - Edit: agent.address.address
    button: |
      **${agent.name_full()}'s address:**
      ${agent.address.on_one_line(bare=True)}
    show if: users[0].address.state != "IL" or name_an_agent
  - Edit: agent.phone_number
    button: |
      **${agent.name_full()}'s phone number:**
      ${ phone_number_formatted(agent.phone_number) }
    show if: users[0].address.state != "IL" or name_an_agent